<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Grief Portrait</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background: #F5F5F0; display: flex; justify-content: center; align-items: center; height: 100vh; }
  </style>
</head>
<body>
  <script>
    let particles = [];
    let flowField;
    let scl = 20;
    let cols, rows;
    let zoff = 0;

    function setup() {
      createCanvas(800, 800);
      background(245, 245, 240);
      cols = floor(width / scl);
      rows = floor(height / scl);
      flowField = new Array(cols * rows);
      
      for (let i = 0; i < 500; i++) {
        particles[i] = new Particle();
      }
    }

    function draw() {
      let yoff = 0;
      for (let y = 0; y < rows; y++) {
        let xoff = 0;
        for (let x = 0; x < cols; x++) {
          let index = x + y * cols;
          let angle = noise(xoff, yoff, zoff) * TWO_PI * 2;
          let v = p5.Vector.fromAngle(angle);
          v.setMag(1);
          flowField[index] = v;
          xoff += 0.1;
        }
        yoff += 0.1;
      }
      zoff += 0.003;

      for (let i = 0; i < particles.length; i++) {
        particles[i].follow(flowField);
        particles[i].update();
        particles[i].edges();
        particles[i].show();
      }
    }

    class Particle {
      constructor() {
        this.pos = createVector(random(width), random(height));
        this.vel = createVector(0, 0);
        this.acc = createVector(0, 0);
        this.maxSpeed = 2;
        this.prevPos = this.pos.copy();
      }

      follow(vectors) {
        let x = floor(this.pos.x / scl);
        let y = floor(this.pos.y / scl);
        let index = x + y * cols;
        let force = vectors[index];
        this.applyForce(force);
      }

      applyForce(force) {
        this.acc.add(force);
      }

      update() {
        this.vel.add(this.acc);
        this.vel.limit(this.maxSpeed);
        this.pos.add(this.vel);
        this.acc.mult(0);
      }

      edges() {
        if (this.pos.x > width) { this.pos.x = 0; this.updatePrev(); }
        if (this.pos.x < 0) { this.pos.x = width; this.updatePrev(); }
        if (this.pos.y > height) { this.pos.y = 0; this.updatePrev(); }
        if (this.pos.y < 0) { this.pos.y = height; this.updatePrev(); }
      }

      updatePrev() {
        this.prevPos.x = this.pos.x;
        this.prevPos.y = this.pos.y;
      }

      show() {
        stroke(200, 100, 80, 40);
        strokeWeight(1);
        line(this.pos.x, this.pos.y, this.prevPos.x, this.prevPos.y);
        this.updatePrev();
      }
    }
  </script>
</body>
</html>
