<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ainu — Grief Portrait</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="index.html" class="back-arrow">←</a>
  
  <div class="piece-page">
    <div class="canvas-container" id="canvas-container"></div>
    <div class="overlay ainu">
      <div class="script">アイヌ</div>
      <h2>Ainu</h2>
      <p class="meta">Isolate · Hokkaido, Japan</p>
      <span class="status">Critically Endangered</span>
      <p class="meta">~10 native speakers</p>
      <p class="sample">"イランカラㇷ゚テ" — irankarapte, "hello"</p>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script>
   const ainuBaseHue = 48;    // warm amber gold
    const ainuSat = 50;       // muted, like old paper
    const ainuBri = 82;       // soft
    const ainuParticleCount = 700;     // dense but delicate
    const ainuFlowSpeed = 0.0012;      // contemplative
    
    new p5(function(p) {
      let particles = [];
      let flowField;
      let scl = 20;
      let cols, rows;
      let zoff = 0;
 
      p.setup = function() {
        p.createCanvas(window.innerWidth, window.innerHeight).parent('canvas-container');
        p.colorMode(p.HSB, 360, 100, 100, 100);
        p.background(42, 12, 97);
        cols = p.floor(p.width / scl);
        rows = p.floor(p.height / scl);
        flowField = new Array(cols * rows);
        for (let i = 0; i < ainuParticleCount; i++) {
          particles.push({
            pos: p.createVector(p.random(p.width), p.random(p.height)),
            vel: p.createVector(0, 0),
            acc: p.createVector(0, 0),
            prevPos: p.createVector(p.random(p.width), p.random(p.height)),
            hueOff: p.random(-25, 25)
          });
        }
      };

      p.draw = function() {
        let yoff = 0;
        for (let y = 0; y < rows; y++) {
          let xoff = 0;
          for (let x = 0; x < cols; x++) {
            let idx = x + y * cols;
            let angle = p.noise(xoff, yoff, zoff) * p.TWO_PI * 2;
            flowField[idx] = p5.Vector.fromAngle(angle).setMag(1);
            xoff += 0.1;
          }
          yoff += 0.1;
        }
        zoff += ainuFlowSpeed;

        for (let i = 0; i < particles.length; i++) {
          let pt = particles[i];
          let x = p.floor(pt.pos.x / scl);
          let y = p.floor(pt.pos.y / scl);
          let idx = x + y * cols;
          if (flowField[idx]) pt.acc.add(flowField[idx]);
          pt.vel.add(pt.acc);
          pt.vel.limit(2);
          pt.pos.add(pt.vel);
          pt.acc.mult(0);
          
          if (pt.pos.x > p.width) { pt.pos.x = 0; pt.prevPos.x = 0; }
          if (pt.pos.x < 0) { pt.pos.x = p.width; pt.prevPos.x = p.width; }
          if (pt.pos.y > p.height) { pt.pos.y = 0; pt.prevPos.y = 0; }
          if (pt.pos.y < 0) { pt.pos.y = p.height; pt.prevPos.y = p.height; }
          
          let h = (ainuBaseHue + pt.hueOff + 360) % 360;
          p.stroke(h, ainuSat + p.random(-10, 10), ainuBri + p.random(-10, 10), 15);
          p.strokeWeight(0.7);
          p.line(pt.pos.x, pt.pos.y, pt.prevPos.x, pt.prevPos.y);
          pt.prevPos.x = pt.pos.x;
          pt.prevPos.y = pt.pos.y;
        }
      };
    });
    
  </script>
</body>
</html>
