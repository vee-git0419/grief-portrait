<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nǀuu — Grief Portrait</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="index.html" class="back">← Back</a>
  
  <div class="piece-page">
    <div class="overlay">
      <h2>Nǀuu (Nǁng)</h2>
      <p>Tuu | South Africa</p>
      <p>~3 speakers | Critically Endangered</p>
      <p style="margin-top: 0.5rem; font-style: italic;">Click consonants: ǀ (dental), ǁ (lateral), ǃ (alveolar)</p>
    </div>
    <div id="canvas-container"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script>
    // Nǀuu (Nǁng) — sparse, ancient, almost gone
    const nuuHue = 18;           // rust/ochre, Kalahari earth
    const nuuSat = 75;           // earthy, saturated
    const nuuBri = 68;           // darker, heavier
    const nuuParticles = 250;    // sparse, like the last speakers
    const nuuSpeed = 0.0008;     // very slow, contemplative

    new p5(function(p) {
      let particles = [];
      let flowField;
      let scl = 20;
      let cols, rows;
      let zoff = 0;

      p.setup = function() {
        p.createCanvas(window.innerWidth, window.innerHeight).parent('canvas-container');
        p.colorMode(p.HSB, 360, 100, 100, 100);
        p.background(25, 15, 94); // warm sand off-white
        cols = p.floor(p.width / scl);
        rows = p.floor(p.height / scl);
        flowField = new Array(cols * rows);
        for (let i = 0; i < nuuParticles; i++) {
          particles.push({
            pos: p.createVector(p.random(p.width), p.random(p.height)),
            vel: p.createVector(0, 0),
            acc: p.createVector(0, 0),
            prevPos: p.createVector(p.random(p.width), p.random(p.height)),
            hueOff: p.random(-15, 15)
          });
        }
      };

      p.draw = function() {
        let yoff = 0;
        for (let y = 0; y < rows; y++) {
          let xoff = 0;
          for (let x = 0; x < cols; x++) {
            let idx = x + y * cols;
            let angle = p.noise(xoff, yoff, zoff) * p.TWO_PI * 2;
            flowField[idx] = p5.Vector.fromAngle(angle).setMag(1);
            xoff += 0.1;
          }
          yoff += 0.1;
        }
        zoff += nuuSpeed;

        for (let i = 0; i < particles.length; i++) {
          let pt = particles[i];
          let x = p.floor(pt.pos.x / scl);
          let y = p.floor(pt.pos.y / scl);
          let idx = x + y * cols;
          if (flowField[idx]) pt.acc.add(flowField[idx]);
          pt.vel.add(pt.acc);
          pt.vel.limit(2);
          pt.pos.add(pt.vel);
          pt.acc.mult(0);
          
          if (pt.pos.x > p.width) { pt.pos.x = 0; pt.prevPos.x = 0; }
          if (pt.pos.x < 0) { pt.pos.x = p.width; pt.prevPos.x = p.width; }
          if (pt.pos.y > p.height) { pt.pos.y = 0; pt.prevPos.y = 0; }
          if (pt.pos.y < 0) { pt.pos.y = p.height; pt.prevPos.y = p.height; }
          
          let h = (nuuHue + pt.hueOff + 360) % 360;
          p.stroke(h, nuuSat + p.random(-10, 10), nuuBri + p.random(-10, 10), 12);
          p.strokeWeight(0.5);
          p.line(pt.pos.x, pt.pos.y, pt.prevPos.x, pt.prevPos.y);
          pt.prevPos.x = pt.pos.x;
          pt.prevPos.y = pt.pos.y;
        }
      };
    });
  </script>
</body>
</html>
